<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>時光仙境圖</title>
  <style>
    body { margin: 0; background: #f6f3e7; color: #243028; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-family: "Noto Serif TC", PMingLiU, serif; font-weight: 500; }
    p { color: #5d6b62; }
    figure { margin: 0 0 36px; }
    img { width: 100%; height: auto; display: block; border: 1px solid rgba(36,48,40,.12); background: #fff; }
    figcaption { padding-top: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>時光仙境圖</h1>
    <p>三張陽光草地，還沒放進正式頁面。</p>
    <figure>
      <img src="/assets/fairyland-meadow.svg" alt="陽光草地與小徑">
      <figcaption>一、草地、遠丘、右邊有太陽</figcaption>
    </figure>
    <figure>
      <img src="/assets/fairyland-sunfield.svg" alt="陽光灑在草地上">
      <figcaption>二、太陽在正中央，草地比較開闊</figcaption>
    </figure>
    <figure>
      <img src="/assets/fairyland-path.svg" alt="草地小徑通向陽光">
      <figcaption>三、一條路通向陽光</figcaption>
    </figure>
  </main>
</body>
</html>
